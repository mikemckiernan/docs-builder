# Builds and pushes two images from the same Dockerfile via multi-stage targets:
#   - <repo>:<sha>      from target `interactive` — runs as the `nvidia` user;
#                       intended for local/interactive use.
#   - <repo>-ci:<sha>   from target `ci` — runs as root so GitHub Actions
#                       container jobs can write the /__w workspace mount;
#                       intended for CI consumers like the Fern preview workflow.
# Both share the `base` and `interactive` layers, so the marginal storage and
# push cost of the second image is small.
#
# Triggers:
#   - pull_request:  build + push both :sha-<short> tags, then hand off the CI
#                    tag to the Fern preview collector via fern-collect.
#   - push tag v*:   build + push both :<semver> tags. No Fern preview.

name: build

on:
  pull_request:
    branches:
      - main
      - 'release-*'
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      ci-image-ref: ${{ steps.ci-ref.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta (interactive)
        id: meta-interactive
        # DOCKER_METADATA_PR_HEAD_SHA makes type=sha use the PR head SHA on pull_request events.
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
          flavor: |
            latest=false

      - name: Docker meta (ci)
        id: meta-ci
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}-ci
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short,prefix=sha-
          flavor: |
            latest=false

      - name: Build interactive image (for test)
        uses: docker/build-push-action@v7
        id: build_interactive
        with:
          context: .
          file: Dockerfile
          target: interactive
          load: true
          tags: ${{ steps.meta-interactive.outputs.tags }}

      - name: Test interactive image
        run: |
          docker run --rm -v $(pwd):/work -w /work \
            "${{ steps.build_interactive.outputs.imageid }}" \
            bash -c "make install-dev && make test"

      - name: Push interactive image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: interactive
          push: true
          tags: ${{ steps.meta-interactive.outputs.tags }}

      - name: Push ci image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ci
          push: true
          tags: ${{ steps.meta-ci.outputs.tags }}

      - name: Export CI image reference
        id: ci-ref
        env:
          TAGS: ${{ steps.meta-ci.outputs.tags }}
        run: |
          PRIMARY=$(echo "$TAGS" | head -n 1)
          echo "image-ref=${PRIMARY}" >> "$GITHUB_OUTPUT"
          echo "CI image reference: ${PRIMARY}"

  fern-collect:
    # Only run the Fern preview collector on PRs. Tag builds do not need a
    # preview.
    if: ${{ github.event_name == 'pull_request' }}
    needs: image
    uses: mikemckiernan/FW-CI-templates/.github/workflows/_fern_docs_preview_build.yml@mmck-docs-fern
    with:
      fern-directory: docs/fern
